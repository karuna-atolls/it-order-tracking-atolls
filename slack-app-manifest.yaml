# Slack app: api.slack.com/apps -> Create New App -> From a manifest -> paste this.
# Replace YOUR-APP-URL with the Cloud Run URL of the deployed app.
display_information:
  name: IT Orders
  description: Order status, delivery and serial-number requests for IT hardware orders
  background_color: "#1f3b5a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: IT Orders
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - users:read
      - users:read.email
      - channels:read
      - groups:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://YOUR-APP-URL/api/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
